name: Build gfh_xls_to_xlsx EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build gfh_xls_to_xlsx.exe
        run: >
          pyinstaller --onefile --windowed --clean
          --name "gfh_xls_to_xlsx"
          --icon "GFH_Telecom_TBLogo.ico"
          --add-data "GFH_Telecom_Logo.png;."
          --hidden-import win32gui --hidden-import win32con
          --hidden-import win32api --hidden-import win32process
          "gfh_xls_to_xlsx.pyw"
      - name: Upload exe directly to release (no Actions storage used)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/gfh_xls_to_xlsx.exe
